<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - StudyMachan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="Signup.css">
<!--<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Space+Mono:wght@700&amp;display=swap" rel="stylesheet"/>-->
<!--<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>-->
<script src="Signup.js">
</script>
</head>
<body class="bg-cream-bg text-ink-text min-h-screen font-body-md antialiased overflow-x-hidden">
<!-- Header (Suppressed Bottom Nav / App Bar for Transactional Screen, keeping Logo only as requested) -->
<header class="absolute top-0 left-0 w-full px-margin-mobile md:px-margin-desktop py-md flex items-center z-50">
<a class="flex items-center gap-2 group" href="#">
<div class="Logo"><img alt="StudyMachan Logo"  src="new logo.jpeg" /></div>
<span class="font-display-md text-display-md font-bold tracking-tight">StudyMachan</span>
</a>
</header>
<!-- Main Content -->
<main class="min-h-screen w-full max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop pt-24 md:pt-32 pb-12 flex flex-col lg:flex-row items-center justify-center gap-12 lg:gap-24">
<!-- Left Column: Welcome & Social Proof -->
<div class="w-full lg:w-1/2 flex flex-col items-center lg:items-start text-center lg:text-left">
<h1 class="font-display-xl text-display-xl lg:text-[64px] lg:leading-[1.1] font-extrabold mb-4">
                Join the <br class="hidden lg:block"/>
<span class="relative inline-block">
                    classroom.
                    <svg class="absolute w-full h-4 -bottom-1 left-0 text-accent-yellow -z-10" preserveaspectratio="none" viewbox="0 0 100 20">
<path d="M0,10 Q50,20 100,5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="8"></path>
</svg>
</span>
</h1>
<p class="font-body-lg text-body-lg text-ink-soft mb-12 max-w-md">
                Connect with great tutors for a fraction of the cost. Start learning today.
            </p>
<!-- Stickers / Social Proof -->
<div class="flex flex-wrap items-center justify-center lg:justify-start gap-4 mb-12 relative">
<!-- Decorative curved dashed line connecting them, visible only on lg -->
<svg class="hidden lg:block absolute top-1/2 left-20 w-32 h-12 text-ink-soft -z-10" fill="none" viewbox="0 0 100 50">
<path d="M0,25 Q50,-10 100,25" fill="none" stroke="currentColor" stroke-dasharray="4 4" stroke-width="2"></path>
</svg>
<div class="bg-accent-yellow border-2 border-ink-text rounded-full w-28 h-28 flex flex-col items-center justify-center shadow-[4px_4px_0px_0px_#2B1B12] rotate-[-6deg] hover:rotate-[-2deg] transition-transform">
<span class="font-display-md text-display-md font-bold block leading-none">12k+</span>
<span class="font-label-mono text-label-mono text-xs uppercase block mt-1">Students</span>
</div>
<div class="bg-teal-deep text-white border-2 border-ink-text rounded-full w-24 h-24 flex flex-col items-center justify-center shadow-[4px_4px_0px_0px_#2B1B12] rotate-[8deg] hover:rotate-[4deg] transition-transform lg:ml-16">
<span class="font-display-md text-[24px] font-bold block leading-none">3k+</span>
<span class="font-label-mono text-label-mono text-xs uppercase block mt-1">Tutors</span>
</div>
</div>
<!-- Visual Element: Map Context -->
<!--<div class="relative w-full max-w-sm rounded-[28px] border-2 border-ink-text bg-white p-4 shadow-[4px_4px_0px_0px_#2B1B12] overflow-hidden group">
<div class="absolute inset-0 bg-[radial-gradient(#8b7269_1px,transparent_1px)] [background-size:16px_16px] opacity-20 group-hover:opacity-40 transition-opacity"></div>
<div class="relative z-10 flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-cream-bg border-2 border-ink-text flex items-center justify-center">
<!-<span class="material-symbols-outlined text-orange-deep" style="font-variation-settings: 'FILL' 1;">location_on</span>-->

<!--<div>
<!--<div class="font-label-mono text-label-mono text-xs text-ink-soft mb-1 uppercase tracking-wider">Book like a ride</div>
<div class="font-button-text text-button-text">Find tutors near you</div>-->
</div>
</div>
</div>
</div>
<!-- Right Column: Sign-up Form -->
<div class="w-full lg:w-1/2 max-w-md">
<div class="bg-white rounded-[28px] border-2 border-ink-text p-6 md:p-8 shadow-[8px_8px_0px_0px_#2B1B12] relative overflow-hidden">
<!-- Top Right Tape Decoration -->
<div class="absolute -top-4 -right-4 w-16 h-8 bg-[#fff]/50 backdrop-blur-sm border border-ink-text/20 rotate-45 z-10 hidden md:block"></div>
<!-- Role Toggle -->
<div class="flex p-1 bg-surface-container border-2 border-ink-text rounded-full mb-8 relative">
<!-- Active Indicator (requires JS for sliding, simple implementation here) -->
<div class="w-1/2 bg-white border-2 border-ink-text rounded-full shadow-[2px_2px_0px_0px_#2B1B12] absolute top-1 bottom-1 left-1 z-0 transition-transform duration-300" id="role-indicator"></div>
<button class="w-1/2 py-2 text-center font-button-text text-button-text z-10 relative" onclick="document.getElementById('role-indicator').style.transform = 'translateX(0)'" type="button">I'm a Student</button>
<button class="w-1/2 py-2 text-center font-button-text text-button-text z-10 relative text-ink-soft" onclick="document.getElementById('role-indicator').style.transform = 'translateX(calc(100% - 8px))'" type="button">I'm a Tutor</button>
</div>
<!-- Social Login -->
<div class="space-y-3 mb-6">
<button class="w-full bg-white border-2 border-ink-text rounded-full py-3 px-4 flex items-center justify-center gap-3 shadow-[2px_2px_0px_0px_#2B1B12] hover:bg-surface-bright active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all font-button-text text-button-text">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 mb-6">
<div class="flex-1 h-px bg-border-line"></div>
<div class="font-label-mono text-label-mono text-ink-soft text-xs">Or sign up with email</div>
<div class="flex-1 h-px bg-border-line"></div>
</div>
<!-- Form -->
<form class="space-y-4">
<div>
<label class="block font-button-text text-sm mb-1 ml-2" for="name">Full Name</label>
<input class="w-full bg-white border-2 border-ink-text rounded-full py-3 px-4 focus:outline-none focus:ring-0 focus:border-orange-deep transition-colors" id="name" placeholder="e.g. Jane Doe" type="text"/>
</div>
<div>
<label class="block font-button-text text-sm mb-1 ml-2" for="email">Email Address</label>
<input class="w-full bg-white border-2 border-ink-text rounded-full py-3 px-4 focus:outline-none focus:ring-0 focus:border-orange-deep transition-colors" id="email" placeholder="you@school.edu" type="email"/>
</div>
<div>
<label class="block font-button-text text-sm mb-1 ml-2" for="password">Password</label>
<input class="w-full bg-white border-2 border-ink-text rounded-full py-3 px-4 focus:outline-none focus:ring-0 focus:border-orange-deep transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full mt-6 bg-orange-deep text-white border-2 border-ink-text rounded-full py-4 px-6 font-display-md text-[20px] shadow-[4px_4px_0px_0px_#2B1B12] hover:bg-primary active:translate-y-[4px] active:translate-x-[4px] active:shadow-none transition-all" type="submit">
                        Create my account
                    </button>
</form>
<div class="mt-6 text-center">
<a class="font-button-text text-button-text text-ink-soft hover:text-orange-deep transition-colors underline decoration-2 underline-offset-4" href="#">
                        Already have an account? Log in
                    </a>
</div>
</div>
</div>
</main>
</body></html>
